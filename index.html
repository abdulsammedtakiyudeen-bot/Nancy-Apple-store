<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NancyTech Mobile | Premium iPhones</title>

  <meta name="description" content="Explore iPhones at NancyTech Mobile. Browse models, compare sample prices, select storage and send an international order enquiry.">

  <meta name="theme-color" content="#080808">

  <style>
    :root {
      --bg: #080808;
      --card: #151515;
      --gold: #d6b46a;
      --white: #ffffff;
      --muted: #a8a8a8;
      --green: #25d366;
      --border: #2b2b2b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
    }

    .announcement {
      background: #111;
      color: #ddd;
      text-align: center;
      padding: 9px;
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8, 8, 8, .97);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      font-size: 14px;
      color: #ddd;
    }

    .cart-button {
      background: white;
      color: black;
      padding: 10px 14px;
      border: 0;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 65px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 35px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: clamp(40px, 6vw, 70px);
      line-height: 1.08;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero p {
      color: var(--muted);
      max-width: 470px;
      margin-bottom: 25px;
    }

    .primary-button {
      display: inline-block;
      padding: 13px 22px;
      background: white;
      color: black;
      border: 0;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary-button:hover {
      background: var(--gold);
    }

    .hero-image {
      min-height: 300px;
      padding: 20px;
      border: 1px solid #333;
      border-radius: 18px;
      background: radial-gradient(ellipse, #373127, #151515 65%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-image img {
      width: 100%;
      height: 300px;
      object-fit: contain;
      filter: drop-shadow(0 15px 20px #000);
    }

    .features {
      max-width: 1200px;
      padding: 0 20px 40px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .feature {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 10px;
      text-align: center;
    }

    .feature strong {
      display: block;
      font-size: 14px;
    }

    .feature small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .section {
      max-width: 1200px;
      padding: 45px 20px 65px;
      margin: auto;
    }

    .section-heading {
      margin-bottom: 25px;
    }

    .section-heading h2 {
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: -1px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 5px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 12px;
      margin-bottom: 25px;
    }

    .filters input,
    .filters select,
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 13px;
      color: white;
      background: #171717;
      border: 1px solid #363636;
      border-radius: 7px;
      outline: none;
    }

    .filters input:focus,
    .filters select:focus,
    .form-group input:focus {
      border-color: var(--gold);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 17px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: transform .2s, border-color .2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: #666;
    }

    .product-image {
      position: relative;
      height: 220px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(ellipse, #333, #171717 72%);
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Show a fallback if an external image fails to load. */
    .product-image.image-fallback::after {
      content: "📱";
      position: absolute;
      font-size: 100px;
      filter: drop-shadow(0 10px 15px #000);
    }

    .badge {
      position: absolute;
      z-index: 2;
      top: 10px;
      left: 10px;
      background: var(--gold);
      color: #111;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      font-size: 16px;
      line-height: 1.4;
    }

    .model-info {
      color: var(--muted);
      font-size: 12px;
      margin: 5px 0 12px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
    }

    .sample-label {
      display: block;
      font-size: 11px;
      color: var(--gold);
      font-weight: normal;
    }

    .product-info label {
      display: block;
      font-size: 12px;
      color: #ddd;
      margin: 12px 0 5px;
    }

    .product-info select {
      width: 100%;
      background: #222;
      color: white;
      border: 1px solid #3b3b3b;
      border-radius: 6px;
      padding: 10px;
    }

    .add-button {
      width: 100%;
      margin-top: 13px;
      padding: 11px;
      border: 0;
      border-radius: 6px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .add-button:hover {
      background: var(--gold);
    }

    .notice {
      color: var(--muted);
      font-size: 12px;
      margin-top: 22px;
    }

    .about {
      background: #111;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: center;
      padding: 55px 20px;
    }

      max-width: 750px;
